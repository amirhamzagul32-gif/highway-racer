<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Ultimate Highway Racer</title>

<style>
/* =========================================================
   ULTIMATE HIGHWAY RACER
   HTML + CSS + JAVASCRIPT
   Single-file racing game
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #07111f;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ---------------------------------------------------------
   GAME CONTAINER
   --------------------------------------------------------- */

#game {
    position: relative;
    width: min(100vw, 1100px);
    height: min(100vh, 760px);
    overflow: hidden;
    background: #111;
}

/* ---------------------------------------------------------
   SKY
   --------------------------------------------------------- */

#sky {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 42%;
    background:
        linear-gradient(
            to bottom,
            #45b8ff 0%,
            #9ee7ff 65%,
            #d8f7ff 100%
        );
    transition: background 1s;
}

#game.night #sky {
    background:
        linear-gradient(
            to bottom,
            #030817 0%,
            #101d42 65%,
            #1b2c51 100%
        );
}

/* ---------------------------------------------------------
   SUN / MOON
   --------------------------------------------------------- */

#sun {
    position: absolute;
    width: 80px;
    height: 80px;
    right: 12%;
    top: 8%;
    border-radius: 50%;
    background: #ffe56b;
    box-shadow: 0 0 45px #fff1a3;
}

#game.night #sun {
    width: 65px;
    height: 65px;
    background: #e6eeff;
    box-shadow: 0 0 25px #cbd8ff;
}

/* ---------------------------------------------------------
   CLOUDS
   --------------------------------------------------------- */

.cloud {
    position: absolute;
    width: 150px;
    height: 45px;
    border-radius: 50px;
    background: rgba(255,255,255,0.8);
    animation: cloudMove 35s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: inherit;
}

.cloud::before {
    width: 70px;
    height: 70px;
    left: 25px;
    bottom: 5px;
}

.cloud::after {
    width: 90px;
    height: 90px;
    right: 20px;
    bottom: 0;
}

.cloud1 {
    top: 9%;
    left: -200px;
}

.cloud2 {
    top: 18%;
    left: -400px;
    animation-delay: 10s;
    transform: scale(.75);
}

.cloud3 {
    top: 5%;
    left: -500px;
    animation-delay: 20s;
    transform: scale(.55);
}

#game.night .cloud {
    opacity: .08;
}

@keyframes cloudMove {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(1400px);
    }
}

/* ---------------------------------------------------------
   MOUNTAINS
   --------------------------------------------------------- */

#mountains {
    position: absolute;
    bottom: 38%;
    left: 0;
    width: 100%;
    height: 150px;
    overflow: hidden;
}

.mountain {
    position: absolute;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: 120px solid transparent;
    border-right: 120px solid transparent;
    border-bottom: 170px solid #4f8f72;
}

.m1 { left: -30px; }
.m2 { left: 180px; transform: scale(1.2); }
.m3 { left: 420px; transform: scale(.9); }
.m4 { left: 650px; transform: scale(1.3); }
.m5 { left: 920px; transform: scale(.8); }

#game.night .mountain {
    border-bottom-color: #182f3d;
}

/* ---------------------------------------------------------
   GROUND
   --------------------------------------------------------- */

#ground {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 60%;
    background:
        repeating-linear-gradient(
            0deg,
            #267735 0px,
            #267735 30px,
            #2b803a 31px,
            #2b803a 60px
        );
}

/* ---------------------------------------------------------
   ROAD
   --------------------------------------------------------- */

#road {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 58%;
    height: 63%;
    background:
        linear-gradient(
            to right,
            #333 0%,
            #505050 4%,
            #303030 7%,
            #303030 93%,
            #505050 96%,
            #333 100%
        );
    overflow: hidden;
    border-left: 8px solid #f5f5f5;
    border-right: 8px solid #f5f5f5;
}

/* ---------------------------------------------------------
   ROAD LANES
   --------------------------------------------------------- */

.lane-line {
    position: absolute;
    top: -100%;
    width: 8px;
    height: 80px;
    background: white;
    opacity: .9;
}

#laneLine1 {
    left: 33.333%;
}

#laneLine2 {
    left: 66.666%;
}

.road-mark {
    position: absolute;
    width: 8px;
    height: 100px;
    background: #fff;
    left: 33.333%;
    transform: translateX(-50%);
}

.road-mark.right {
    left: 66.666%;
}

/* ---------------------------------------------------------
   SIDE POSTS
   --------------------------------------------------------- */

.road-side {
    position: absolute;
    bottom: 0;
    width: 25px;
    height: 100%;
}

.road-side.left {
    left: calc(21% - 13px);
}

.road-side.right {
    right: calc(21% - 13px);
}

.post {
    position: absolute;
    width: 9px;
    height: 42px;
    background: white;
    border-top: 9px solid red;
}

/* ---------------------------------------------------------
   HUD
   --------------------------------------------------------- */

#hud {
    position: absolute;
    z-index: 100;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
}

.hud-box {
    min-width: 105px;
    padding: 10px 14px;
    color: white;
    background: rgba(0,0,0,.48);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    text-align: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
}

.hud-title {
    display: block;
    font-size: 11px;
    opacity: .7;
    letter-spacing: 1px;
}

.hud-value {
    display: block;
    font-size: 21px;
    font-weight: bold;
    margin-top: 3px;
}

/* ---------------------------------------------------------
   PLAYER CAR
   --------------------------------------------------------- */

#player {
    position: absolute;
    z-index: 50;
    width: 72px;
    height: 128px;
    left: 50%;
    bottom: 55px;
    transform: translateX(-50%);
    transition: left .12s ease;
}

.car-body {
    position: absolute;
    left: 7px;
    top: 0;
    width: 58px;
    height: 115px;
    border-radius: 18px 18px 12px 12px;
    background:
        linear-gradient(
            90deg,
            #7b0000,
            #e20d16 20%,
            #ff3030 50%,
            #e20d16 80%,
            #720000
        );
    border: 3px solid #510000;
    box-shadow:
        0 10px 18px rgba(0,0,0,.45),
        inset 0 0 10px rgba(255,255,255,.25);
}

.car-body::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 15px;
    width: 36px;
    height: 30px;
    border-radius: 12px 12px 5px 5px;
    background:
        linear-gradient(
            135deg,
            #ccefff,
            #396b87
        );
    border: 2px solid #193746;
}

.car-body::after {
    content: "";
    position: absolute;
    left: 10px;
    top: 49px;
    width: 34px;
    height: 22px;
    border-radius: 5px;
    background: #9bdcff;
    opacity: .8;
}

.car-light {
    position: absolute;
    width: 10px;
    height: 12px;
    border-radius: 3px;
    background: #fff;
    box-shadow: 0 0 8px white;
}

.car-light.left {
    left: 13px;
    top: 5px;
}

.car-light.right {
    right: 13px;
    top: 5px;
}

.tail-light {
    position: absolute;
    width: 9px;
    height: 13px;
    background: #ff1b1b;
    bottom: 7px;
    box-shadow: 0 0 8px red;
}

.tail-light.left {
    left: 11px;
}

.tail-light.right {
    right: 11px;
}

.wheel {
    position: absolute;
    width: 12px;
    height: 32px;
    border-radius: 5px;
    background: #111;
}

.wheel.front-left {
    left: 0;
    top: 20px;
}

.wheel.front-right {
    right: 0;
    top: 20px;
}

.wheel.back-left {
    left: 0;
    bottom: 18px;
}

.wheel.back-right {
    right: 0;
    bottom: 18px;
}

/* ---------------------------------------------------------
   ENEMY CARS
   --------------------------------------------------------- */

.enemy {
    position: absolute;
    z-index: 45;
    width: 68px;
    height: 115px;
    transform: translateX(-50%);
}

.enemy-body {
    position: absolute;
    left: 6px;
    top: 0;
    width: 56px;
    height: 104px;
    border-radius: 17px;
    background:
        linear-gradient(
            90deg,
            #171717,
            #555,
            #191919
        );
    border: 3px solid #111;
    box-shadow: 0 8px 15px rgba(0,0,0,.4);
}

.enemy:nth-child(3n) .enemy-body {
    background:
        linear-gradient(
            90deg,
            #002e63,
            #0878e8,
            #002e63
        );
}

.enemy:nth-child(4n) .enemy-body {
    background:
        linear-gradient(
            90deg,
            #6d2b00,
            #e36a15,
            #6d2b00
        );
}

.enemy-window {
    position: absolute;
    left: 9px;
    top: 13px;
    width: 34px;
    height: 29px;
    border-radius: 10px 10px 4px 4px;
    background: #182b38;
    border: 2px solid #0b151b;
}

.enemy-light {
    position: absolute;
    bottom: 7px;
    width: 9px;
    height: 12px;
    border-radius: 2px;
    background: #ff1b1b;
    box-shadow: 0 0 8px red;
}

.enemy-light.left {
    left: 10px;
}

.enemy-light.right {
    right: 10px;
}

/* ---------------------------------------------------------
   COINS
   --------------------------------------------------------- */

.coin {
    position: absolute;
    z-index: 42;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            #fff5a1 0%,
            #ffd21c 35%,
            #e99b00 70%,
            #8d5800 100%
        );
    border: 3px solid #fff0a0;
    box-shadow:
        0 0 12px #ffd000,
        inset 0 0 5px #fff;
    transform: translateX(-50%);
}

.coin::after {
    content: "$";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #8a5800;
    font-weight: bold;
    font-size: 17px;
}

.coin.spin {
    animation: coinSpin .35s linear infinite;
}

@keyframes coinSpin {
    0% { transform: translateX(-50%) rotateY(0deg); }
    50% { transform: translateX(-50%) rotateY(90deg); }
    100% { transform: translateX(-50%) rotateY(180deg); }
}

/* ---------------------------------------------------------
   PARTICLES
   --------------------------------------------------------- */

.particle {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 90;
}

/* ---------------------------------------------------------
   START SCREEN
   --------------------------------------------------------- */

.overlay {
    position: absolute;
    z-index: 200;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(5px);
}

.panel {
    width: min(90%, 600px);
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    color: white;
    background:
        linear-gradient(
            145deg,
            rgba(12,22,39,.97),
            rgba(28,42,62,.96)
        );
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 20px 70px rgba(0,0,0,.6);
}

.logo {
    font-size: clamp(35px, 7vw, 70px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #ff3b3b;
    text-shadow:
        3px 3px 0 #650000,
        0 0 25px rgba(255,40,40,.5);
}

.subtitle {
    margin-top: 8px;
    color: #b9c7d7;
    font-size: 15px;
}

.menu-stats {
    margin: 25px 0;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.stat {
    padding: 13px;
    border-radius: 12px;
    background: rgba(255,255,255,.06);
}

.stat b {
    display: block;
    font-size: 22px;
    color: #ffd43b;
}

.stat span {
    font-size: 11px;
    color: #aebdce;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    color: white;
    transition: transform .15s, filter .15s;
}

button:hover {
    transform: scale(1.04);
    filter: brightness(1.15);
}

button:active {
    transform: scale(.96);
}

#startBtn,
#restartBtn {
    width: 100%;
    padding: 17px;
    border-radius: 13px;
    font-size: 18px;
    background:
        linear-gradient(
            135deg,
            #ff3030,
            #b90000
        );
    box-shadow: 0 7px 20px rgba(255,0,0,.3);
}

#instructions {
    margin-top: 17px;
    color: #aebdce;
    font-size: 13px;
    line-height: 1.7;
}

/* ---------------------------------------------------------
   PAUSE BUTTON
   --------------------------------------------------------- */

#pauseBtn {
    position: absolute;
    z-index: 120;
    top: 90px;
    right: 18px;
    padding: 9px 14px;
    border-radius: 10px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25);
}

/* ---------------------------------------------------------
   MOBILE CONTROLS
   --------------------------------------------------------- */

#mobileControls {
    position: absolute;
    z-index: 130;
    left: 0;
    right: 0;
    bottom: 15px;
    display: none;
    justify-content: space-between;
    padding: 0 18px;
    pointer-events: none;
}

.touchBtn {
    pointer-events: auto;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: rgba(0,0,0,.5);
    border: 2px solid rgba(255,255,255,.3);
    font-size: 30px;
}

@media (max-width: 700px) {
    #game {
        width: 100vw;
        height: 100vh;
    }

    #road {
        width: 72%;
    }

    #mobileControls {
        display: flex;
    }

    .hud-box {
        min-width: 75px;
        padding: 7px;
    }

    .hud-value {
        font-size: 16px;
    }

    .hud-title {
        font-size: 9px;
    }

    #pauseBtn {
        top: 85px;
        right: 10px;
    }

    .panel {
        padding: 25px;
    }

    .menu-stats {
        grid-template-columns: repeat(3,1fr);
    }
}

/* ---------------------------------------------------------
   FLASH EFFECT
   --------------------------------------------------------- */

#flash {
    position: absolute;
    z-index: 180;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}

#flash.hit {
    animation: hitFlash .3s ease;
}

@keyframes hitFlash {
    0% { opacity: .8; }
    100% { opacity: 0; }
}

/* ---------------------------------------------------------
   GAME OVER
   --------------------------------------------------------- */

#gameOverScreen {
    display: none;
}

.game-over-title {
    font-size: 48px;
    color: #ff4141;
    font-weight: 900;
}

.final-score {
    margin: 18px 0;
    font-size: 25px;
}

.final-score strong {
    color: #ffd438;
}

/* ---------------------------------------------------------
   NIGHT STARS
   --------------------------------------------------------- */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: 0;
}

#game.night .star {
    opacity: .8;
}

/* ---------------------------------------------------------
   SPEED LINES
   --------------------------------------------------------- */

.speed-line {
    position: absolute;
    width: 3px;
    height: 25px;
    background: rgba(255,255,255,.35);
    z-index: 10;
    opacity: 0;
}

.fast .speed-line {
    opacity: 1;
}

/* ---------------------------------------------------------
   LEVEL MESSAGE
   --------------------------------------------------------- */

#levelMessage {
    position: absolute;
    z-index: 150;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 32px;
    font-weight: 900;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 3px 15px black;
}

#levelMessage.show {
    animation: levelPop 1.4s ease;
}

@keyframes levelPop {
    0% {
        opacity: 0;
        transform: translate(-50%,-40%) scale(.7);
    }

    20% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.1);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(-50%,-60%) scale(1);
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- SKY -->
    <div id="sky">
        <div id="sun"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div class="star" style="left:8%;top:9%"></div>
        <div class="star" style="left:17%;top:17%"></div>
        <div class="star" style="left:25%;top:7%"></div>
        <div class="star" style="left:34%;top:22%"></div>
        <div class="star" style="left:44%;top:11%"></div>
        <div class="star" style="left:55%;top:19%"></div>
        <div class="star" style="left:68%;top:8%"></div>
        <div class="star" style="left:77%;top:24%"></div>
        <div class="star" style="left:87%;top:12%"></div>
        <div class="star" style="left:94%;top:19%"></div>
    </div>

    <!-- MOUNTAINS -->
    <div id="mountains">
        <div class="mountain m1"></div>
        <div class="mountain m2"></div>
        <div class="mountain m3"></div>
        <div class="mountain m4"></div>
        <div class="mountain m5"></div>
    </div>

    <!-- GROUND -->
    <div id="ground"></div>

    <!-- ROAD -->
    <div id="road">
        <div id="laneLine1" class="lane-line"></div>
        <div id="laneLine2" class="lane-line"></div>

        <div class="road-side left"></div>
        <div class="road-side right"></div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-box">
            <span class="hud-title">SCORE</span>
            <span class="hud-value" id="score">0</span>
        </div>

        <div class="hud-box">
            <span class="hud-title">COINS</span>
            <span class="hud-value" id="coins">0</span>
        </div>

        <div class="hud-box">
            <span class="hud-title">SPEED</span>
            <span class="hud-value" id="speed">0</span>
        </div>

        <div class="hud-box">
            <span class="hud-title">LIVES</span>
            <span class="hud-value" id="lives">❤️❤️❤️</span>
        </div>
    </div>

    <!-- PAUSE -->
    <button id="pauseBtn">⏸ PAUSE</button>

    <!-- PLAYER -->
    <div id="player">

        <div class="wheel front-left"></div>
        <div class="wheel front-right"></div>
        <div class="wheel back-left"></div>
        <div class="wheel back-right"></div>

        <div class="car-body">
            <div class="car-light left"></div>
            <div class="car-light right"></div>

            <div class="tail-light left"></div>
            <div class="tail-light right"></div>
        </div>

    </div>

    <!-- GAME EFFECTS -->
    <div id="flash"></div>
    <div id="levelMessage"></div>

    <!-- MOBILE CONTROLS -->
    <div id="mobileControls">
        <button class="touchBtn" id="leftBtn">◀</button>
        <button class="touchBtn" id="rightBtn">▶</button>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="overlay">
        <div class="panel">

            <div class="logo">
                HIGHWAY
            </div>

            <div class="logo">
                RACER
            </div>

            <div class="subtitle">
                Ultimate 3-Lane Racing Challenge
            </div>

            <div class="menu-stats">
                <div class="stat">
                    <b>3</b>
                    <span>LANES</span>
                </div>

                <div class="stat">
                    <b>∞</b>
                    <span>ROAD</span>
                </div>

                <div class="stat">
                    <b>⚡</b>
                    <span>SPEED</span>
                </div>
            </div>

            <button id="startBtn">
                ▶ START RACE
            </button>

            <div id="instructions">
                PC: Use <b>← →</b> or <b>A / D</b> to change lanes.<br>
                Mobile: Use the left and right buttons.<br>
                Collect coins, avoid traffic and survive!
            </div>

        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="overlay">
        <div class="panel">

            <div class="game-over-title">
                GAME OVER
            </div>

            <div class="final-score">
                Score:
                <strong id="finalScore">0</strong>
            </div>

            <div class="final-score">
                Coins:
                <strong id="finalCoins">0</strong>
            </div>

            <div class="final-score">
                High Score:
                <strong id="finalHighScore">0</strong>
            </div>

            <button id="restartBtn">
                🔄 PLAY AGAIN
            </button>

        </div>
    </div>

</div>

<script>
/* =========================================================
   ULTIMATE HIGHWAY RACER
   JAVASCRIPT GAME ENGINE
   ========================================================= */

/* ---------------------------------------------------------
   DOM ELEMENTS
   --------------------------------------------------------- */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const player =
    document.getElementById("player");

const scoreDisplay =
    document.getElementById("score");

const coinsDisplay =
    document.getElementById("coins");

const speedDisplay =
    document.getElementById("speed");

const livesDisplay =
    document.getElementById("lives");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const startBtn =
    document.getElementById("startBtn");

const restartBtn =
    document.getElementById("restartBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const leftBtn =
    document.getElementById("leftBtn");

const rightBtn =
    document.getElementById("rightBtn");

const flash =
    document.getElementById("flash");

const levelMessage =
    document.getElementById("levelMessage");

const finalScore =
    document.getElementById("finalScore");

const finalCoins =
    document.getElementById("finalCoins");

const finalHighScore =
    document.getElementById("finalHighScore");


/* ---------------------------------------------------------
   GAME STATE
   --------------------------------------------------------- */

let gameRunning = false;
let gamePaused = false;

let lastTime = 0;

let score = 0;
let coins = 0;
let lives = 3;

let speed = 5;
let level = 1;

let distance = 0;

let lane = 1;

let enemyCars = [];
let coinObjects = [];

let roadMarks = [];

let enemyTimer = 0;
let coinTimer = 0;

let roadScroll = 0;

let highScore =
    Number(localStorage.getItem("highwayHighScore")) || 0;


/* ---------------------------------------------------------
   LANE POSITIONS
   --------------------------------------------------------- */

function getLaneX(laneNumber) {

    const width =
        road.clientWidth;

    const positions = [
        width * 0.166,
        width * 0.500,
        width * 0.834
    ];

    return positions[laneNumber];
}


/* ---------------------------------------------------------
   PLAYER POSITION
   --------------------------------------------------------- */

function updatePlayerPosition() {

    const x =
        getLaneX(lane);

    player.style.left =
        x + "px";
}


/* ---------------------------------------------------------
   CREATE ROAD MARKS
   --------------------------------------------------------- */

function createRoadMarks() {

    for (let i = 0; i < 14; i++) {

        const mark1 =
            document.createElement("div");

        mark1.className =
            "road-mark";

        mark1.style.top =
            (i * 90 - 200) + "px";

        road.appendChild(mark1);

        roadMarks.push(mark1);


        const mark2 =
            document.createElement("div");

        mark2.className =
            "road-mark right";

        mark2.style.top =
            (i * 90 - 200) + "px";

        road.appendChild(mark2);

        roadMarks.push(mark2);
    }
}


/* ---------------------------------------------------------
   RESET ROAD MARKS
   --------------------------------------------------------- */

function resetRoadMarks() {

    roadMarks.forEach(
        mark => mark.remove()
    );

    roadMarks = [];

    createRoadMarks();
}


/* ---------------------------------------------------------
   MOVE ROAD MARKS
   --------------------------------------------------------- */

function moveRoadMarks(delta) {

    roadScroll +=
        speed * delta * 0.7;

    roadMarks.forEach(mark => {

        let top =
            parseFloat(mark.style.top);

        top +=
            speed * delta * 0.7;

        if (top > road.clientHeight) {

            top -=
                road.clientHeight + 200;
        }

        mark.style.top =
            top + "px";
    });
}


/* ---------------------------------------------------------
   CREATE ENEMY CAR
   --------------------------------------------------------- */

function createEnemy() {

    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";

    const laneNumber =
        Math.floor(Math.random() * 3);

    enemy.dataset.lane =
        laneNumber;

    enemy.dataset.y =
        "-150";

    enemy.style.left =
        getLaneX(laneNumber) + "px";

    enemy.style.top =
        "-150px";


    const body =
        document.createElement("div");

    body.className =
        "enemy-body";


    const window =
        document.createElement("div");

    window.className =
        "enemy-window";


    const light1 =
        document.createElement("div");

    light1.className =
        "enemy-light left";


    const light2 =
        document.createElement("div");

    light2.className =
        "enemy-light right";


    body.appendChild(window);

    body.appendChild(light1);

    body.appendChild(light2);

    enemy.appendChild(body);

    road.appendChild(enemy);

    enemyCars.push(enemy);
}


/* ---------------------------------------------------------
   MOVE ENEMY CARS
   --------------------------------------------------------- */

function updateEnemies(delta) {

    for (
        let i = enemyCars.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemyCars[i];

        let y =
            parseFloat(enemy.dataset.y);

        y +=
            speed * delta * 0.75;

        enemy.dataset.y =
            y;

        enemy.style.top =
            y + "px";


        if (
            y >
            road.clientHeight + 150
        ) {

            enemy.remove();

            enemyCars.splice(i,1);

            score += 10;

            continue;
        }


        if (
            checkCollision(
                player,
                enemy
            )
        ) {

            hitEnemy(enemy);

            enemy.remove();

            enemyCars.splice(i,1);
        }
    }
}


/* ---------------------------------------------------------
   CREATE COIN
   --------------------------------------------------------- */

function createCoin() {

    const coin =
        document.createElement("div");

    coin.className =
        "coin spin";

    const laneNumber =
        Math.floor(Math.random() * 3);

    coin.dataset.lane =
        laneNumber;

    coin.dataset.y =
        "-50";

    coin.style.left =
        getLaneX(laneNumber) + "px";

    coin.style.top =
        "-50px";

    road.appendChild(coin);

    coinObjects.push(coin);
}


/* ---------------------------------------------------------
   MOVE COINS
   --------------------------------------------------------- */

function updateCoins(delta) {

    for (
        let i = coinObjects.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coinObjects[i];

        let y =
            parseFloat(coin.dataset.y);

        y +=
            speed * delta * 0.8;

        coin.dataset.y =
            y;

        coin.style.top =
            y + "px";


        if (
            y >
            road.clientHeight + 50
        ) {

            coin.remove();

            coinObjects.splice(i,1);

            continue;
        }


        if (
            checkCollision(
                player,
                coin
            )
        ) {

            collectCoin(coin);

            coin.remove();

            coinObjects.splice(i,1);
        }
    }
}


/* ---------------------------------------------------------
   COLLISION DETECTION
   --------------------------------------------------------- */

function checkCollision(a,b) {

    const rectA =
        a.getBoundingClientRect();

    const rectB =
        b.getBoundingClientRect();

    const padding = 10;

    return (
        rectA.left + padding <
        rectB.right - padding &&

        rectA.right - padding >
        rectB.left + padding &&

        rectA.top + padding <
        rectB.bottom - padding &&

        rectA.bottom - padding >
        rectB.top + padding
    );
}


/* ---------------------------------------------------------
   HIT ENEMY
   --------------------------------------------------------- */

function hitEnemy(enemy) {

    lives--;

    updateHUD();

    flash.classList.remove("hit");

    void flash.offsetWidth;

    flash.classList.add("hit");

    createExplosion(
        player.getBoundingClientRect()
    );

    playCrashSound();


    player.animate(
        [
            { transform: "translateX(-50%) rotate(0deg)" },
            { transform: "translateX(-50%) rotate(-8deg)" },
            { transform: "translateX(-50%) rotate(8deg)" },
            { transform: "translateX(-50%) rotate(0deg)" }
        ],
        {
            duration: 400
        }
    );


    if (lives <= 0) {

        endGame();

        return;
    }

    speed = Math.max(
        4,
        speed - 1
    );
}


/* ---------------------------------------------------------
   COLLECT COIN
   --------------------------------------------------------- */

function collectCoin(coin) {

    coins++;

    score += 50;

    updateHUD();

    createCoinParticles(
        coin.getBoundingClientRect()
    );

    playCoinSound();
}


/* ---------------------------------------------------------
   PARTICLE EXPLOSION
   --------------------------------------------------------- */

function createExplosion(rect) {

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            centerX + "px";

        particle.style.top =
            centerY + "px";

        particle.style.background =
            Math.random() > .5
                ? "#ffcc00"
                : "#ff3b30";

        document.body.appendChild(
            particle
        );


        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            40 +
            Math.random() *
            100;

        const x =
            Math.cos(angle) *
            distance;

        const y =
            Math.sin(angle) *
            distance;


        particle.animate(
            [
                {
                    transform:
                        "translate(0,0) scale(1)",
                    opacity: 1
                },
                {
                    transform:
                        `translate(${x}px,${y}px) scale(0)`,
                    opacity: 0
                }
            ],
            {
                duration:
                    500 +
                    Math.random() * 500,
                easing:
                    "ease-out"
            }
        ).onfinish = () => {

            particle.remove();
        };
    }
}


/* ---------------------------------------------------------
   COIN PARTICLES
   --------------------------------------------------------- */

function createCoinParticles(rect) {

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            centerX + "px";

        particle.style.top =
            centerY + "px";

        particle.style.background =
            "#ffd21c";


        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            20 +
            Math.random() * 60;


        const x =
            Math.cos(angle) *
            distance;

        const y =
            Math.sin(angle) *
            distance;


        particle.animate(
            [
                {
                    transform:
                        "translate(0,0) scale(1)",
                    opacity: 1
                },
                {
                    transform:
                        `translate(${x}px,${y}px) scale(0)`,
                    opacity: 0
                }
            ],
            {
                duration: 400,
                easing: "ease-out"
            }
        ).onfinish = () => {
            particle.remove();
        };


        document.body.appendChild(
            particle
        );
    }
}


/* ---------------------------------------------------------
   CHANGE LANE
   --------------------------------------------------------- */

function moveLeft() {

    if (!gameRunning || gamePaused)
        return;

    if (lane > 0) {

        lane--;

        updatePlayerPosition();

        playMoveSound();
    }
}


function moveRight() {

    if (!gameRunning || gamePaused)
        return;

    if (lane < 2) {

        lane++;

        updatePlayerPosition();

        playMoveSound();
    }
}


/* ---------------------------------------------------------
   KEYBOARD
   --------------------------------------------------------- */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            event.preventDefault();

            moveLeft();
        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            event.preventDefault();

            moveRight();
        }


        if (
            event.key === " " ||
            event.key.toLowerCase() === "p"
        ) {

            event.preventDefault();

            togglePause();
        }
    }
);


/* ---------------------------------------------------------
   MOBILE BUTTONS
   --------------------------------------------------------- */

leftBtn.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveLeft();
    }
);


rightBtn.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveRight();
    }
);


leftBtn.addEventListener(
    "click",
    moveLeft
);

rightBtn.addEventListener(
    "click",
    moveRight
);


/* ---------------------------------------------------------
   UPDATE SCORE
   --------------------------------------------------------- */

function updateScore(delta) {

    distance +=
        speed * delta * .1;

    score +=
        speed * delta * .03;

    const newLevel =
        Math.floor(
            distance / 1000
        ) + 1;


    if (
        newLevel >
        level
    ) {

        level =
            newLevel;

        speed += .8;

        showLevelMessage();
    }
}


/* ---------------------------------------------------------
   LEVEL MESSAGE
   --------------------------------------------------------- */

function showLevelMessage() {

    levelMessage.textContent =
        "LEVEL " + level;

    levelMessage.classList.remove(
        "show"
    );

    void levelMessage.offsetWidth;

    levelMessage.classList.add(
        "show"
    );
}


/* ---------------------------------------------------------
   UPDATE HUD
   --------------------------------------------------------- */

function updateHUD() {

    scoreDisplay.textContent =
        Math.floor(score);

    coinsDisplay.textContent =
        coins;

    speedDisplay.textContent =
        Math.floor(speed * 20) +
        " KM/H";

    let hearts = "";

    for (
        let i = 0;
        i < lives;
        i++
    ) {

        hearts += "❤️";
    }

    livesDisplay.textContent =
        hearts || "💀";
}


/* ---------------------------------------------------------
   SPAWN TIMER
   --------------------------------------------------------- */

function updateSpawning(delta) {

    enemyTimer += delta;

    coinTimer += delta;


    const enemyInterval =
        Math.max(
            500,
            1500 -
            level * 70
        );


    if (
        enemyTimer >
        enemyInterval
    ) {

        enemyTimer = 0;

        createEnemy();


        if (
            Math.random() <
            Math.min(.25, level * .01)
        ) {

            setTimeout(
                createEnemy,
                300
            );
        }
    }


    if (
        coinTimer >
        900
    ) {

        coinTimer = 0;

        createCoin();
    }
}


/* ---------------------------------------------------------
   DAY / NIGHT
   --------------------------------------------------------- */

let nightTimer = 0;

function updateDayNight(delta) {

    nightTimer +=
        delta;

    const cycle =
        nightTimer %
        30000;

    if (
        cycle >
        18000
    ) {

        game.classList.add(
            "night"
        );

    } else {

        game.classList.remove(
            "night"
        );
    }
}


/* ---------------------------------------------------------
   PAUSE
   --------------------------------------------------------- */

function togglePause() {

    if (!gameRunning)
        return;

    gamePaused =
        !gamePaused;

    pauseBtn.textContent =
        gamePaused
            ? "▶ RESUME"
            : "⏸ PAUSE";
}


/* ---------------------------------------------------------
   START GAME
   --------------------------------------------------------- */

function startGame() {

    startScreen.style.display =
        "none";

    gameOverScreen.style.display =
        "none";


    gameRunning = true;

    gamePaused = false;


    score = 0;

    coins = 0;

    lives = 3;

    speed = 5;

    level = 1;

    distance = 0;

    lane = 1;

    enemyTimer = 0;

    coinTimer = 0;

    nightTimer = 0;


    clearObjects();

    resetRoadMarks();

    updatePlayerPosition();

    updateHUD();


    pauseBtn.textContent =
        "⏸ PAUSE";


    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* ---------------------------------------------------------
   CLEAR OBJECTS
   --------------------------------------------------------- */

function clearObjects() {

    enemyCars.forEach(
        enemy => enemy.remove()
    );

    coinObjects.forEach(
        coin => coin.remove()
    );

    enemyCars = [];

    coinObjects = [];
}


/* ---------------------------------------------------------
   END GAME
   --------------------------------------------------------- */

function endGame() {

    gameRunning = false;

    gamePaused = false;


    const final =
        Math.floor(score);


    if (
        final >
        highScore
    ) {

        highScore =
            final;

        localStorage.setItem(
            "highwayHighScore",
            highScore
        );
    }


    finalScore.textContent =
        final;

    finalCoins.textContent =
        coins;

    finalHighScore.textContent =
        highScore;


    gameOverScreen.style.display =
        "flex";


    playGameOverSound();
}


/* ---------------------------------------------------------
   GAME LOOP
   --------------------------------------------------------- */

function gameLoop(timestamp) {

    if (!gameRunning)
        return;


    if (!gamePaused) {

        const delta =
            Math.min(
                40,
                timestamp - lastTime
            );

        lastTime =
            timestamp;


        moveRoadMarks(delta);

        updateEnemies(delta);

        updateCoins(delta);

        updateSpawning(delta);

        updateScore(delta);

        updateDayNight(delta);

        updateHUD();


        if (
            speed >
            8
        ) {

            game.classList.add(
                "fast"
            );

        } else {

            game.classList.remove(
                "fast"
            );
        }
    }


    requestAnimationFrame(
        gameLoop
    );
}

restartBtn.addEventListener(

/* ---------------------------------------------------------
   SIMPLE SOUND ENGINE
   --------------------------------------------------------- */

let audioContext = null;


function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    return audioContext;
}


function beep(
    frequency,
    duration,
    type = "sine",
    volume = .04
) {

    try {

        const audio =
            getAudio();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            volume;


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime +
            duration
        );

        oscillator.stop(
            audio.currentTime +
            duration
        );

    } catch (error) {
        /* Audio may be blocked */
    }
}


function playCoinSound() {

    beep(
        900,
        .08,
        "square",
        .05
    );

    setTimeout(
        () => beep(
            1300,
            .12,
            "square",
            .04
        ),
        70
    );
}


function playCrashSound() {

    beep(
        90,
        .35,
        "sawtooth",
        .08
    );

    setTimeout(
        () => beep(
            55,
            .4,
            "sawtooth",
            .06
        ),
        100
    );
}


function playMoveSound() {

    beep(
        280,
        .04,
        "square",
        .025
    );
}


function playGameOverSound() {

    beep(
        200,
        .15,
        "sawtooth",
        .05
    );

    setTimeout(
        () => beep(
            130,
            .3,
            "sawtooth",
            .05
        ),
        150
    );
}

/* ---------------------------------------------------------

   --------------------------------------------------------- */

let touchStartX = 0;

game.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length !== 1
        )
            return;

        touchStartX =
            event.touches[0].clientX;
    },
    {
        passive: true
    }
);


game.addEventListener(
    "touchend",
    function(event) {

        if (
            !gameRunning
        )
            return;


        const touchEndX =
            event.changedTouches[0].clientX;

        const difference =
            touchEndX -
            touchStartX;


        if (
            Math.abs(difference) <
            35
        )
            return;


        if (
            difference < 0
        ) {

            moveLeft();

        } else {

            moveRight();
        }
    },
    {
        passive: true
    }
);

    engineStarted = true;

        const audio =

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value =
            55;

        gain.gain.value =
            .012;


        oscillator.connect(gain);

        gain.connect(

        );

        oscillator.start();


        setInterval(

                if (
                    gameRunning &&
                    !gamePaused
                ) {

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.max(
        minimum,
        Math.min(
            maximum,
            value
        )
    );
}


function randomNumber(

) {

    ) + minimum;

/* ---------------------------------------------------------

function updateSpeedEffect() {

            "none";
    }
}


/* ---------------------------------------------------------
   EXTRA LOOP EFFECT
   --------------------------------------------------------- */

setInterval(
    function() {

        if (
            gameRunning &&
            !gamePaused
        ) {

            updateSpeedEffect();
        }

    },
    200
);


/* ---------------------------------------------------------
   SAVE HIGH SCORE PERIODICALLY
   --------------------------------------------------------- */

setInterval(
    function() {

        if (
            score >
            highScore
        ) {

            highScore =
                Math.floor(score);

            localStorage.setItem(
                "highwayHighScore",
                highScore
            );
        }

    },
    3000
);


/* ---------------------------------------------------------
   CONSOLE INFORMATION
   --------------------------------------------------------- */

console.log(
    "ULTIMATE HIGHWAY RACER loaded."
);

console.log(
    "Controls: Arrow Keys / A-D / Touch"
);

console.log(
    "High Score:",
    highScore
);

</script>
